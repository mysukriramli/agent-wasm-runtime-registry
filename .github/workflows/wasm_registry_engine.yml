name: Wasm Registry Engine

on:
  push:
    paths:
      - 'modules/**'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wasm-registry-compile
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install wabt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/wasm_registry.db
          key: wasm-registry-db-${{ github.run_id }}
          restore-keys: |
            wasm-registry-db-

      - name: Execute Wasm Compilation & Registry Engine
        run: python wasm_engine.py

      - name: Commit and push permanent historical ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"
          git add data/history/

          if git diff --staged --quiet; then
            echo "No wasm bytecode drift detected."
          else
            git commit -m "chore(history): record wasm module bytecode compilation [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
